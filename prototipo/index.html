<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talhão CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de trabalho. Menu lateral fixo no computador, barra inferior com botão central de registro no celular. */
:root{
  --bg:#f4f5f0; --surface:#ffffff; --sunk:#eceee6; --line:#dadfd2; --line-2:#c7cdbf;
  --fg:#1b241e; --muted:#5b685e; --soil:#6b4a2b;
  --leaf:#2f6b3a; --leaf-2:#4f8f5b; --leaf-soft:#e1eddf; --corn:#b88209; --corn-soft:#f6ebcf;
  --risk:#b4432f; --risk-soft:#f6e1dc; --sky:#2d6a8f; --sky-soft:#deebf2;
  --shadow:0 18px 40px -24px rgb(20 40 25 / .45);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#192019; --sunk:#222a23; --line:#2f3930; --line-2:#3d483e;
  --fg:#e5ebe3; --muted:#99a69b; --soil:#d1ab83;
  --leaf:#7cc28a; --leaf-2:#5ea46c; --leaf-soft:#1e3223; --corn:#e3b143; --corn-soft:#382e17;
  --risk:#ef8a76; --risk-soft:#3b221d; --sky:#80b8d8; --sky-soft:#1b2d38;
  --shadow:0 18px 40px -24px rgb(0 0 0 / .8); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#192019; --sunk:#222a23; --line:#2f3930; --line-2:#3d483e;
  --fg:#e5ebe3; --muted:#99a69b; --soil:#d1ab83;
  --leaf:#7cc28a; --leaf-2:#5ea46c; --leaf-soft:#1e3223; --corn:#e3b143; --corn-soft:#382e17;
  --risk:#ef8a76; --risk-soft:#3b221d; --sky:#80b8d8; --sky-soft:#1b2d38;
  --shadow:0 18px 40px -24px rgb(0 0 0 / .8); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--corn);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.side a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.side a svg{width:19px;height:19px}
.side a:hover{background:var(--sunk);color:var(--fg)}
.side a[aria-current="page"]{background:var(--leaf-soft);color:var(--leaf)}
.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px;font-weight:600}
.side-foot{margin-top:auto;display:grid;gap:8px;padding-top:12px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--sunk);border:0;border-radius:9px;padding:8px 10px;text-align:left;width:100%}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--leaf);flex:none}
.sync.off i{background:var(--corn)}
.me{display:flex;gap:10px;align-items:center;padding:6px 8px;font-size:13px}
.me small{display:block;color:var(--muted);font-size:11.5px}

.main{min-width:0;padding-block:0 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .mbrand{display:none}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px 9px 36px;outline:none}
.gsearch input:focus{border-color:var(--leaf)}
.gsearch>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;max-height:60vh;overflow-y:auto}
.results h4{margin:0;padding:8px 12px 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.results .empty{padding:12px;color:var(--muted);font-size:13px}
.top-acts{display:flex;gap:8px;margin-left:auto;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--leaf);color:var(--bg);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--line-2)}
.btn.ghost{background:none;color:var(--muted);border:0}
.btn.wide{width:100%;padding:12px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--risk-soft);color:var(--risk)}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.icon-btn svg{width:18px;height:18px}

.view{display:grid;gap:18px;padding-top:8px;max-width:1180px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h1{font-size:clamp(24px,3vw,30px);letter-spacing:-.015em}
.vh p{margin:3px 0 0;color:var(--muted)}
.vh .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Peças ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card>h3,.ch{font-size:15px;font-family:var(--f-body);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ch a,.link{color:var(--leaf);font-size:13px;font-weight:500;cursor:pointer;background:none;border:0;padding:0;text-decoration:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;min-width:0}
button.kpi:hover{border-color:var(--line-2)}
.kpi span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.kpi b{display:block;font-family:var(--f-display);font-size:25px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.warn b{color:var(--risk)}
.kpi.good small{color:var(--leaf)}
.meter{height:5px;border-radius:99px;background:var(--sunk);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--leaf)}

.list{display:grid}
.row{display:flex;gap:11px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-width:0}
.row:last-child{border-bottom:0}
button.row:hover,a.row:hover{background:var(--sunk)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:12.5px;color:var(--muted);flex:none}
.row .t{font-family:var(--f-data);font-size:12px;color:var(--muted);width:44px;flex:none}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;background:var(--leaf-soft);color:var(--leaf)}
.av.c{background:var(--corn-soft);color:var(--soil)} .av.s{background:var(--sky-soft);color:var(--sky)} .av.g{background:var(--sunk);color:var(--muted)}
.av.lg{width:52px;height:52px;border-radius:14px;font-size:17px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.tag.g{background:var(--leaf-soft);color:var(--leaf)} .tag.y{background:var(--corn-soft);color:var(--soil)} .tag.r{background:var(--risk-soft);color:var(--risk)} .tag.b{background:var(--sky-soft);color:var(--sky)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;color:var(--bg)}
.chk svg{width:13px;height:13px}
.done .chk{background:var(--leaf);border-color:var(--leaf)}
.done .m b{text-decoration:line-through;color:var(--muted)}

.alert{display:flex;gap:11px;padding:11px 12px;border-radius:12px;background:var(--corn-soft);align-items:flex-start;border:0;text-align:left;width:100%}
.alert+.alert{margin-top:8px}
.alert svg{color:var(--soil);margin-top:2px;width:17px;height:17px}
.alert b{display:block;font-size:13.5px}
.alert span{font-size:13px;color:var(--fg);opacity:.85}
.alert.ai{background:var(--leaf-soft)} .alert.ai svg{color:var(--leaf)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:13px}

.shortcuts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;font-weight:500;text-align:left;min-width:0}
.sc:hover{border-color:var(--leaf)}
.sc i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--leaf-soft);color:var(--leaf)}
.sc i svg{width:18px;height:18px}
.sc.main{background:var(--leaf);color:var(--bg);border-color:var(--leaf)}
.sc.main i{background:rgb(255 255 255 / .18);color:var(--bg)}

/* linha do tempo */
.tl{position:relative;padding-left:24px;display:grid;gap:14px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative}
.ev::before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--leaf)}
.ev.new::before{background:var(--corn);border-color:var(--corn)}
.ev small{color:var(--muted);font-size:11.5px;font-family:var(--f-data)}
.ev b{display:block;font-size:14px}
.ev p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.ev .chips{margin-top:6px}

/* ficha */
.fhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.fhead .m{flex:1;min-width:200px}
.fhead h1{font-size:clamp(22px,3vw,28px)}
.fhead .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qa .btn{flex:1 1 auto}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.facts div{background:var(--sunk);border-radius:10px;padding:9px 11px;min-width:0}
.facts small{display:block;font-size:11.5px;color:var(--muted)}
.facts b{font-size:15px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--leaf)}

/* tabela */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}

/* funil */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:13px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.col-h b{font-size:13.5px}
.col-h span{font-family:var(--f-data);font-size:11.5px;color:var(--muted)}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:grid;gap:4px;width:100%}
.opp:hover{border-color:var(--line-2)}
.opp b{font-size:13.5px}
.opp small{color:var(--muted);font-size:12px}
.opp .q{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-data);font-size:12px}

/* gráficos */
.vbars{display:flex;align-items:flex-end;gap:10px;height:170px;position:relative;padding:0 2px;border-bottom:1px solid var(--line)}
.vbars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0}
.vbars .b i{display:block;width:min(100%,34px);background:var(--leaf);border-radius:4px 4px 0 0}
.vbars .b.part i{background:var(--leaf-2);opacity:.7}
.vbars .b i{position:relative;min-height:18px}
.vbars .b em{position:absolute;top:3px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--bg);font-family:var(--f-data);font-weight:500}
.vlab{display:flex;gap:10px;padding:5px 2px 0}
.vlab span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.goal{position:absolute;left:0;right:0;border-top:2px dashed var(--corn);pointer-events:none}
.goal span{position:absolute;right:0;top:-19px;font-size:11px;color:var(--soil);background:var(--surface);padding:0 4px;font-weight:600}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hb .trk{height:12px;background:var(--sunk);border-radius:99px;display:flex;gap:2px;overflow:hidden}
.hb .trk i{display:block;height:100%}
.hb .trk i:first-child{border-radius:99px 0 0 99px}
.hb .trk i:last-child{border-radius:0 99px 99px 0}
.hb .trk i:only-child{border-radius:99px}
.hb .v{font-family:var(--f-data);font-size:12px;color:var(--muted);white-space:nowrap}
.hb .mk{position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;max-width:240px;box-shadow:var(--shadow)}
.linechart svg{width:100%;height:auto;display:block}

/* agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 0;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.wd b{font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.wd[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.wd[aria-pressed="true"] b{color:var(--bg)}
.wd .dots{display:flex;gap:2px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:50%;background:var(--corn)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .h{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.md{min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 6px;font-size:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.md.out{opacity:.4}
.md.today{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.md b{font-variant-numeric:tabular-nums}
.md em{font-style:normal;font-size:10.5px;background:var(--leaf-soft);color:var(--leaf);border-radius:5px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.md em.x{background:var(--sky-soft);color:var(--sky)}
.md em.f{background:var(--corn-soft);color:var(--soil)}
.evt{display:flex;gap:12px;padding:11px 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--leaf);text-align:left;width:100%;align-items:flex-start}
.evt.x{border-left-color:var(--sky)} .evt.f{border-left-color:var(--corn)}
.evt .t{font-family:var(--f-data);font-size:12.5px;width:46px;flex:none;padding-top:1px}
.evt .m{flex:1;min-width:0}
.evt .m b{display:block;font-size:14px}
.evt .m small{color:var(--muted);font-size:12.5px}
.gs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.gs i{width:8px;height:8px;border-radius:50%;background:var(--leaf)}
.route{counter-reset:r;display:grid;gap:0}
.route div{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.route div::before{counter-increment:r;content:counter(r);width:22px;height:22px;border-radius:50%;background:var(--leaf);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.route small{color:var(--muted);margin-left:auto;font-family:var(--f-data);font-size:12px}

/* registro por voz */
.rec{display:grid;justify-items:center;gap:6px;padding:12px 0 4px;text-align:center}
.mic{width:104px;height:104px;border-radius:50%;border:0;background:var(--leaf);color:var(--bg);display:grid;place-items:center;position:relative;margin:8px 0}
.mic svg{width:40px;height:40px}
.mic.on{background:var(--risk)}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--risk);opacity:.4;animation:pulse 1.2s infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion: reduce){.mic.on::after{animation:none}}
.timer{font-family:var(--f-data);font-size:22px}
.wave{display:flex;gap:3px;align-items:center;height:28px}
.wave i{width:3px;border-radius:2px;background:var(--risk);opacity:.7}
.quote{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:14px;font-style:italic;color:var(--muted)}
.aibox{border:1.5px solid var(--leaf);border-radius:14px;padding:14px;background:var(--surface)}
.ai-h{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--leaf);font-weight:600;margin-bottom:6px}
.ai-h svg{width:16px;height:16px}
.fld{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.fld:last-child{border-bottom:0}
.fld label{color:var(--muted);font-size:12.5px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;outline:none;min-width:0}
.inp:focus{border-color:var(--leaf)}
.fld .inp{background:var(--sunk);border-color:transparent}
textarea.inp{resize:vertical;min-height:80px}
.opt{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;background:var(--leaf-soft);padding:9px 11px;border-radius:10px;cursor:pointer}
.opt input{accent-color:var(--leaf);margin-top:3px}
.opts{display:grid;gap:6px}
.attach{display:flex;gap:8px;flex-wrap:wrap}
.attach label{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line-2);border-radius:9px;padding:7px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.attach label svg{width:16px;height:16px}
.attach input{position:absolute;opacity:0;width:1px;height:1px}
.form{display:grid;gap:12px}
.form .f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* assistente */
.chat{display:grid;gap:12px;align-content:start}
.msg{max-width:min(620px,92%);padding:11px 14px;border-radius:14px;font-size:14px}
.msg.u{justify-self:end;background:var(--leaf);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a ul{margin:6px 0 0;padding-left:18px}
.msg.a li{margin:2px 0}
.msg .src{font-size:11.5px;color:var(--muted);margin-top:8px}
.ask{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.ask .inp{padding:11px 14px;border-radius:12px}

/* relatório */
.rep-l{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.models{display:grid;gap:6px}
.model{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.model[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.model b{display:block;font-size:13.5px}
.model small{color:var(--muted);font-size:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:clamp(18px,4vw,40px);display:grid;gap:18px;min-width:0}
.paper header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:12px}
.paper h2{font-size:22px}
.paper h3{font-size:15px;font-family:var(--f-body);font-weight:600;margin-bottom:6px}
.paper .meta{font-size:12.5px;color:var(--muted);text-align:right}
.paper p{margin:0;max-width:70ch}
.paper ul{margin:0;padding-left:18px}
.rk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rk div{border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.rk small{display:block;color:var(--muted);font-size:11.5px}
.rk b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.exp{display:flex;gap:8px;flex-wrap:wrap}

/* folhas (modais) */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgb(10 20 12 / .42);display:grid;place-items:center;padding:20px}
.sheet{background:var(--bg);border-radius:18px;width:min(560px,100%);max-height:min(88vh,860px);overflow-y:auto;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:20px}
.menu-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.menu-g button,.menu-g a{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 6px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--fg);text-align:center}
.menu-g svg{width:22px;height:22px;color:var(--leaf)}
.menu-g .main{grid-column:1 / -1;flex-direction:row;justify-content:center;background:var(--leaf);color:var(--bg);font-size:14.5px;font-weight:600;border-color:var(--leaf)}
.menu-g .main svg{color:var(--bg)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

.bnav{display:none}
.nl-add{margin-top:8px;background:var(--leaf-soft);color:var(--leaf);border:1.5px dashed var(--leaf);white-space:normal;text-align:left;font-size:14.5px;padding:12px}
.nl-add:hover{background:var(--leaf);color:var(--bg);border-style:solid}
.cart-l{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.cart-sel{display:none;width:100%;padding:10px 12px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.sp{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.empty-s{padding:18px;text-align:center;color:var(--muted);font-size:13.5px}

@media (max-width:1100px){

  .g-dash{grid-template-columns:minmax(0,1fr)}

  .models{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}

@media (max-width:560px){

  const atencao=`<div class="card"><div class="ch">Precisa de atenção</div>
    ${semAc.map(c=>`<button type="button" class="alert" data-cli="${c.id}">${ic('warn')}<div><b>${esc(c.nome)}</b><span>Sem visita há ${c.ult} dias${c.status==='potencial'?' · cliente potencial':''}. ${c.id==='cv'?'Maior revenda da região sem conversa sobre a safrinha.':c.id==='jb'?'Área de teste em aberto.':'Indicação ainda sem visita.'}</span></div></button>`).join('')}
    <button type="button" class="alert ai" data-go="oportunidades">${ic('spark')}<div><b>Bom Jesus pode fechar ainda este mês</b><span>A previsão de fechamento é ${curto(fromIso('2026-12-05'))} e a tabela de preços prometida está atrasada.</span></div></button></div>`;
  const tarefas=`<div class="card"><div class="ch">Tarefas <a href="#agenda">todas</a></div><div class="list" id="dash-tasks">${tarefasHtml(D.tarefas.filter(t=>!t.done||diff(fromIso(t.prazo))>=-1).sort((a,b)=>a.prazo.localeCompare(b.prazo)).slice(0,5))}</div>
    <button type="button" class="link" data-sheet="tarefa" style="margin-top:10px">+ Nova tarefa</button></div>`;
  const etapas=['Prospecção','Apresentação','Negociação'];
  const mx=Math.max(...etapas.map(e=>sum(ab.filter(o=>o.etapa===e),o=>o.sc)),1);
  const funil=`<div class="card"><div class="ch">Oportunidades abertas <a href="#oportunidades">abrir funil</a></div><div class="hbars">${etapas.map(e=>{const v=sum(ab.filter(o=>o.etapa===e),o=>o.sc),n=ab.filter(o=>o.etapa===e).length;return `<div class="hb"><span>${e}</span><div class="trk"><i style="width:${v/mx*100}%;background:var(--leaf)" data-tip="${e}: ${fmt(v)} sc em ${n} oportunidade${n>1?'s':''}"></i></div><span class="v">${fmt(v)} sc</span></div>`}).join('')}</div>
    <div class="small muted" style="margin-top:12px">Previsão ponderada pela etapa: <b class="num" style="color:var(--fg)">${fmt(Math.round(sum(ab,o=>o.sc*PROB[o.etapa])))} sc</b></div></div>`;
  const visitas=`<div class="card"><div class="ch">Visitas por mês <span class="small muted" style="font-weight:400">meta ${META.visitasMes}</span></div>${vbars(VIS_MES,META.visitasMes,'visitas')}</div>`;
  const anivs=aniversarios(14);
  const aniv=`<div class="card"><div class="ch">Aniversários e datas</div><div class="list">${anivs.length?anivs.map(a=>`<button type="button" class="row" data-cli="${a.c.id}"><span class="av c">${ic('cake')}</span><div class="m"><b>${esc(a.p.n)}</b><small>${esc(a.p.f)} · ${esc(a.c.nome)}</small></div><span class="r">${a.quando}</span></button>`).join(''):'<div class="empty-s">Nenhum aniversário nas próximas duas semanas.</div>'}</div></div>`;
  const col1=[on.agenda&&agenda,on.tarefas&&tarefas,on.visitas&&visitas].filter(Boolean).join('');
  const col2=[on.atencao&&atencao,on.funil&&funil,on.aniv&&aniv].filter(Boolean).join('');
  return `<div class="vh"><div><p>${DIAS[d.getDay()][0].toUpperCase()+DIAS[d.getDay()].slice(1)}, ${d.getDate()} de ${MESES[d.getMonth()]}</p><h1>Bom dia, Luana</h1></div>
   <div class="acts"><button type="button" class="btn sec sm" data-sheet="personalizar">${ic('gear')}Personalizar</button></div></div>
   ${on.kpis?kpis:''}${on.atalhos?atalhos:''}
   <div class="grid g-dash"><div class="grid" style="align-content:start">${col1}</div><div class="grid" style="align-content:start">${col2}</div></div>`;
};
function evtHtml(e){
  const k=e.k==='x'?'x':e.k==='f'?'f':'';
  return `<button type="button" class="evt ${k}" ${e.c?(e.campo?`data-campo="${e.campo}"`:`data-cli="${e.c}"`):''}><span class="t">${e.h}</span><div class="m"><b>${esc(e.t)}</b><small>${esc(e.s||'')}</small></div>${e.k==='x'?'<span class="tag b">Google</span>':e.k==='f'?'<span class="tag y">Campo</span>':''}</button>`;
}
function tarefasHtml(list){
  if(!list.length)return '<div class="empty-s">Nada por aqui.</div>';
  return list.map(t=>{const st=tarefaEstado(t),c=cli(t.c);return `<button type="button" class="row ${t.done?'done':''}" data-task="${t.id}"><span class="chk">${t.done?ic('check',3):''}</span><div class="m"><b>${esc(t.t)}</b><small>${c?esc(c.nome)+' · ':''}${t.done?'concluída':quando(t.prazo)}</small></div>${st==='late'?'<span class="tag r">Atrasada</span>':t.prio==='Alta'&&!t.done?'<span class="tag y">Alta</span>':''}</button>`}).join('');
}
function aniversarios(dias){
  const out=[];
  D.clientes.forEach(c=>c.contatos.forEach(p=>{if(!p.aniv)return;const [m,dd]=p.aniv.split('-').map(Number);let dt=new Date(2026,m-1,dd);if(dt<HOJE)dt=new Date(2027,m-1,dd);const n=diff(dt);if(n<=dias)out.push({c,p,n,quando:n===0?'hoje':n===1?'amanhã':curto(dt)})}));
  return out.sort((a,b)=>a.n-b.n);
}
function vbars(data,meta,un){
  const mx=Math.max(meta||0,...data.map(d=>d.v))*1.12;
  return `<div class="vbars">${meta?`<div class="goal" style="bottom:${meta/mx*100}%"><span>meta ${meta}</span></div>`:''}${data.map(d=>`<div class="b ${d.part?'part':''}" data-tip="${d.m}: ${d.v} ${un}${d.part?' (mês em andamento)':''}"><i style="height:${d.v/mx*100}%"><em>${d.v}</em></i></div>`).join('')}</div><div class="vlab">${data.map(d=>`<span>${d.m}</span>`).join('')}</div>`;
}

/* ---------- Clientes ---------- */

}

/* ---------- Ficha ---------- */
VIEWS.ficha=(id)=>{
  const c=cli(id); if(!c)return '<div class="empty-s">Cliente não encontrado.</div>';
  const ops=D.opps.filter(o=>o.c===id);
  const ab=ops.filter(o=>!['Fechada','Perdida'].includes(o.etapa));
  const comprado=sum(ops.filter(o=>o.etapa==='Fechada'),o=>o.sc);
  const t=S.tabFicha;
  const tab=(k,l,n)=>`<button type="button" role="tab" data-ftab="${k}" aria-selected="${t===k}">${l}${n!=null?` <span class="muted">${n}</span>`:''}</button>`;
  const prox=D.eventos.filter(e=>e.c===id&&diff(fromIso(e.d))>=0).sort((a,b)=>(a.d+a.h).localeCompare(b.d+b.h))[0];
  let body='';
  if(t==='tl') body=`<div class="tl">${c.tl.map(e=>`<div class="ev ${e.novo?'new':''}"><small>${curto(fromIso(e.d))} · ${quando(e.d)}</small><b>${e.k} · ${esc(e.t)}</b><p>${esc(e.p)}</p>${e.tags?`<div class="chips">${e.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}</div>`).join('')}</div>`;
  if(t==='ct') body=`<div class="list">${c.contatos.map(p=>`<div class="row"><span class="av">${ini(p.n)}</span><div class="m"><b>${esc(p.n)}</b><small>${esc(p.f)} · <span class="num">${esc(p.t)}</span>${p.e?' · '+esc(p.e):''}</small></div><div class="r">${p.aniv?`${ic('cake').replace('<svg','<svg width="14" height="14" style="vertical-align:-2px"')} ${p.aniv.split('-').reverse().join('/')}`:''}</div><button type="button" class="icon-btn" data-copy="${esc(p.t)}" aria-label="Copiar telefone de ${esc(p.n)}">${ic('phone')}</button></div>`).join('')}</div><button type="button" class="link" data-sheet="contato" style="margin-top:10px">+ Adicionar contato</button>`;
  const minhas=D.lojas.filter(l=>l.canal===id);
  if(t==='pr'&&minhas.length) body=`<div class="list">${minhas.map(l=>{const n=daLoja(l.id).length;return `<a class="row" href="#loja-${l.id}" style="text-decoration:none;color:inherit"><span class="av s">${ic('store')}</span><div class="m"><b>${esc(lojaNome(l))}</b><small>${l.obs?esc(l.obs)+' · ':''}${n} cliente${n===1?'':'s'} vinculado${n===1?'':'s'}</small></div><span class="r">ver carteira</span></a>`}).join('')}</div><button type="button" class="link" data-sheet="novaloja" data-pre="${id}" style="margin-top:10px">+ Adicionar loja ou unidade</button>`;
  else if(t==='pr') body=c.props.length?`<div class="list">${c.props.map(p=>`<div class="row"><span class="av c">${ic('field')}</span><div class="m"><b>${esc(p.n)}</b><small>${esc(p.a)} · ${esc(p.c)}</small></div></div>`).join('')}</div>`:'<div class="empty-s">Nenhuma propriedade ou unidade cadastrada.</div>';
  if(t==='op') body=ops.length?`<div class="tbl"><table><thead><tr><th>Produto</th><th>Safra</th><th>Etapa</th><th class="n">Volume</th></tr></thead><tbody>${ops.map(o=>`<tr class="click" data-opp="${o.id}"><td>${o.p}</td><td>${o.safra}</td><td>${etapaTag(o)}</td><td class="n">${fmt(o.sc)} sc</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-s">Nenhuma oportunidade ainda.</div>';
  if(t==='cp'){const cs=D.campos.filter(x=>x.c===id),dc=D.diasCampo.filter(x=>x.c===id);body=(cs.length||dc.length)?`<div class="list">${cs.map(x=>`<button type="button" class="row" data-campo="${x.id}"><span class="av c">${ic('field')}</span><div class="m"><b>${esc(x.nome)}</b><small>${x.hib.map(h=>h.n).join(', ')}</small></div><span class="tag ${x.status==='Colhido'?'g':x.status==='Planejado'?'b':'y'}">${x.status}</span></button>`).join('')}${dc.map(x=>`<div class="row"><span class="av">${ic('users')}</span><div class="m"><b>${esc(x.nome)}</b><small>${curto(fromIso(x.data))} · ${x.status==='Realizado'?x.part+' participantes':x.conf+' confirmados'}</small></div></div>`).join('')}</div>`:'<div class="empty-s">Nenhuma atividade de campo com este cliente.</div>'}
  return `<button type="button" class="link" data-go="clientes" style="justify-self:start;display:inline-flex;align-items:center;gap:4px">${ic('back').replace('<svg','<svg width="16" height="16"')}Clientes</button>
  <div class="card"><div class="fhead"><span class="av lg ${avc(c)}">${ini(c.nome)}</span><div class="m"><h1>${esc(c.nome)}</h1><div class="sub">${c.tipo} · ${esc(c.cidade)} · ${c.regiao}</div><div class="chips" style="margin-top:8px">${statusTag(c.status)}<span class="tag y">Potencial ${c.potencial.toLowerCase()}</span><span class="tag">${esc(c.area)}</span></div>${c.segmento!=='Canal'||(c.lojas||[]).length?`<div class="chips" style="margin-top:8px;align-items:center"><span class="small muted">Compra em</span>${lojasTags(c)||'<span class="small muted">nenhuma loja vinculada</span>'}<button type="button" class="link" data-sheet="vincular" data-pre="${id}">${(c.lojas||[]).length?'alterar':'+ vincular loja'}</button></div>`:''}</div></div>
   <div class="qa"><button type="button" class="btn" data-go="registrar" data-pre="${id}">${ic('mic')}Registrar visita</button><button type="button" class="btn sec" data-sheet="evento" data-pre="${id}">${ic('cal')}Agendar</button><button type="button" class="btn sec" data-sheet="opp" data-pre="${id}">${ic('funnel')}Oportunidade</button><button type="button" class="btn sec" data-copy="${esc(c.contatos[0].t)}">${ic('phone')}${esc(c.contatos[0].t)}</button></div>
   <div class="facts"><div><small>Última visita</small><b>${c.ult===0?'hoje':'há '+c.ult+' dias'}</b></div><div><small>Próximo compromisso</small><b>${prox?curto(fromIso(prox.d))+' · '+prox.h:'nenhum'}</b></div><div><small>Em aberto</small><b>${fmt(sum(ab,o=>o.sc))} sc</b></div><div><small>Comprado na safra</small><b>${fmt(comprado)} sc</b></div></div></div>
  <div class="card"><div class="tabs" role="tablist">${tab('tl','Linha do tempo',c.tl.length)}${tab('ct','Contatos',c.contatos.length)}${tab('pr',c.tipo==='Produtor'?'Propriedades':'Lojas e unidades',c.tipo==='Produtor'?c.props.length:D.lojas.filter(l=>l.canal===id).length)}${tab('op','Oportunidades',ops.length)}${tab('cp','Campo')}</div><div style="padding-top:14px">${body}</div></div>`;
};
function etapaTag(o){return o.etapa==='Fechada'?'<span class="tag g">Fechada</span>':o.etapa==='Perdida'?'<span class="tag r">Perdida</span>':o.etapa==='Negociação'?'<span class="tag y">Negociação</span>':`<span class="tag b">${o.etapa}</span>`}

/* ---------- Carteira por loja ---------- */

  const L=loja(sel),cs=daLoja(sel);
  const ab=D.opps.filter(o=>cs.some(c=>c.id===o.c)&&!['Fechada','Perdida'].includes(o.etapa));
  const fe=D.opps.filter(o=>cs.some(c=>c.id===o.c)&&o.etapa==='Fechada');

  const lista=canais().map(c=>`<div class="card" style="padding:10px 12px"><div class="ch" style="margin-bottom:4px"><a href="#cliente-${c.id}" style="color:inherit;text-decoration:none">${esc(c.nome)}</a><button type="button" class="link" data-sheet="novaloja" data-pre="${c.id}">+ loja</button></div><div class="list">${D.lojas.filter(l=>l.canal===c.id).map(l=>{const n=daLoja(l.id).length;return `<a class="row" href="#loja-${l.id}" style="text-decoration:none;color:inherit;padding:8px 6px;border-radius:8px;${l.id===sel?'background:var(--leaf-soft)':''}" ${l.id===sel?'aria-current="true"':''}><span class="av s" style="width:30px;height:30px">${ic('store').replace('<svg','<svg width="16" height="16"')}</span><div class="m"><b>${esc(l.nome)}</b><small>${l.obs?esc(l.obs):'Loja'}</small></div><span class="tag ${n?'g':''}">${n}</span></a>`}).join('')}</div></div>`).join('');
  return `<div class="vh"><div><h1>Carteira por loja</h1><p>Clientes vinculados a cada loja ou unidade dos seus canais.</p></div><div class="acts"><button type="button" class="btn" data-sheet="novaloja" data-pre="${L.canal}">${ic('plus',2.4)}Nova loja</button></div></div>
  <select class="sel cart-sel" id="cart-sel" aria-label="Escolher loja">${lojaOpts(sel)}</select>

   <div class="qa"><button type="button" class="btn" data-sheet="cliente" data-pre="${sel}">${ic('plus',2.4)}Cadastrar cliente nesta loja</button><button type="button" class="btn sec" data-sheet="vinculaloja" data-pre="${sel}">${ic('users')}Vincular cliente existente</button></div>
   <div class="facts"><div><small>Clientes</small><b>${cs.length}</b></div><div><small>Área dos clientes</small><b>${fmt(sum(cs,haDe))} ha</b></div><div><small>Em aberto</small><b>${fmt(sum(ab,o=>o.sc))} sc</b></div><div><small>Fechado na safra</small><b>${fmt(sum(fe,o=>o.sc))} sc</b></div></div></div>
   <div class="card" style="padding:6px 12px"><div class="list">${cs.length?cs.sort((a,b)=>b.ult-a.ult).map(c=>{const o=D.opps.filter(x=>x.c===c.id&&!['Fechada','Perdida'].includes(x.etapa));return `<button type="button" class="row" data-cli="${c.id}"><span class="av ${avc(c)}">${ini(c.nome)}</span><div class="m"><b>${esc(c.nome)}</b><small>${esc(c.area)}${c.lojas.length>1?' · também compra em '+c.lojas.filter(x=>x!==sel).map(x=>esc(lojaNome(loja(x)))).join(', '):''}</small></div><div class="r">${statusTag(c.status)}<div style="margin-top:3px;${c.ult>45?'color:var(--risk)':''}" class="${c.ult>45?'':'muted'}">visita há ${c.ult} d</div>${o.length?`<div class="num">${fmt(sum(o,x=>x.sc))} sc em aberto</div>`:''}</div></button>`}).join(''):`<div class="empty-s">Nenhum cliente vinculado a esta loja ainda.<br>Use "Cadastrar cliente nesta loja" ou "Vincular cliente existente".</div>`}</div></div>
   ${sem.length?`<div class="alert">${ic('warn')}<div><b>${sem.length} cliente${sem.length>1?'s':''} desta loja sem visita há mais de 45 dias</b><span>${sem.map(c=>esc(c.nome)).join(', ')}</span></div></div>`:''}</div></div>`;
};


/* ---------- Visitas ---------- */
VIEWS.visitas=()=>{
  const todas=[];D.clientes.forEach(c=>c.tl.forEach(e=>todas.push({...e,c})));todas.sort((a,b)=>b.d.localeCompare(a.d));
  const tipos=['Visita','Reunião','Ligação','Dia de campo','Campo'];
  const cont=Object.fromEntries(tipos.map(t=>[t,todas.filter(x=>x.k===t).length]));
  const freq=D.clientes.filter(c=>c.status!=='inativo').map(c=>({c,n:c.tl.filter(e=>['Visita','Reunião','Dia de campo'].includes(e.k)).length})).sort((a,b)=>b.n-a.n);
  return `<div class="vh"><div><h1>Visitas e atendimentos</h1><p>Tudo o que aconteceu com cada cliente, do mais recente para o mais antigo.</p></div><div class="acts"><button type="button" class="btn" data-go="registrar">${ic('mic')}Registrar por voz</button><button type="button" class="btn sec" data-sheet="registro-texto">${ic('pen')}Escrever</button></div></div>

    <div class="fld"><label for="f-c">Cliente</label><select class="inp" id="f-c">${D.clientes.map(x=>`<option value="${x.id}" ${x.id===r.c?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>

AFTER.registrar=()=>{

  else corpo=`<div class="card" style="padding:4px 8px"><div class="tbl"><table><thead><tr><th>Cliente</th><th>Produto</th><th>Safra</th><th>Etapa</th><th class="n">Sacos</th><th class="n">Área</th><th>Previsão</th></tr></thead><tbody>${l.map(o=>`<tr class="click" data-opp="${o.id}"><td>${esc(cli(o.c).nome)}</td><td>${o.p}</td><td>${o.safra}</td><td>${etapaTag(o)}</td><td class="n">${fmt(o.sc)}</td><td class="n">${fmt(o.ha)} ha</td><td>${o.etapa==='Perdida'?esc(o.motivo):curto(fromIso(o.prev))}</td></tr>`).join('')}</tbody></table></div></div>`;

  <div class="sp"><div class="chips scroll">${safras.map(s=>`<button type="button" class="chip" data-safra="${s}" aria-pressed="${S.funilSafra===s}">${s==='todas'?'Todas as safras':s}</button>`).join('')}</div><div class="seg"><button type="button" data-fmodo="funil" aria-pressed="${S.funilModo==='funil'}">Funil</button><button type="button" data-fmodo="lista" aria-pressed="${S.funilModo==='lista'}">Lista</button></div></div>

  }

   <div class="grid" style="align-content:start"><div class="card"><div class="ch">Tarefas</div><div class="chips" style="margin-bottom:8px"><button type="button" class="chip" data-tf="pend" aria-pressed="${tf==='pend'}">Pendentes ${cnt('pend')+cnt('late')}</button><button type="button" class="chip" data-tf="late" aria-pressed="${tf==='late'}">Atrasadas ${cnt('late')}</button><button type="button" class="chip" data-tf="done" aria-pressed="${tf==='done'}">Concluídas ${cnt('done')}</button></div><div class="list">${tarefasHtml(tl)}</div><button type="button" class="link" data-sheet="tarefa" style="margin-top:10px">+ Nova tarefa</button></div>
   <div class="card"><div class="ch">Aniversários</div><div class="list">${anivs.map(a=>`<button type="button" class="row" data-cli="${a.c.id}"><span class="av c">${ic('cake')}</span><div class="m"><b>${esc(a.p.n)}</b><small>${esc(a.c.nome)}</small></div><span class="r">${a.quando}</span></button>`).join('')}</div></div></div></div>`;

/* ---------- Resultados (inteligência) ---------- */
VIEWS.inteligencia=()=>{
  const fe=D.opps.filter(o=>o.etapa==='Fechada'),ab=abertas();
  const regs=[...new Set(D.clientes.map(c=>c.regiao))];
  const porReg=regs.map(r=>({r,f:sum(fe.filter(o=>cli(o.c).regiao===r),o=>o.sc),a:sum(ab.filter(o=>cli(o.c).regiao===r),o=>o.sc)})).filter(x=>x.f||x.a).sort((a,b)=>(b.f+b.a)-(a.f+a.a));
  const prods=[...new Set(D.opps.map(o=>o.p))];
  const porProd=prods.map(p=>({r:p,f:sum(fe.filter(o=>o.p===p),o=>o.sc),a:sum(ab.filter(o=>o.p===p),o=>o.sc)})).sort((a,b)=>(b.f+b.a)-(a.f+a.a));
  const stack=(arr)=>{const mx=Math.max(...arr.map(x=>x.f+x.a));return `<div class="hbars">${arr.map(x=>`<div class="hb"><span>${esc(x.r)}</span><div class="trk">${x.f?`<i style="width:${x.f/mx*100}%;background:var(--leaf)" data-tip="${esc(x.r)} · fechado: ${fmt(x.f)} sc"></i>`:''}${x.a?`<i style="width:${x.a/mx*100}%;background:var(--corn)" data-tip="${esc(x.r)} · em negociação: ${fmt(x.a)} sc"></i>`:''}</div><span class="v">${fmt(x.f+x.a)} sc</span></div>`).join('')}</div><div class="legend"><span><i style="background:var(--leaf)"></i>Fechado</span><span><i style="background:var(--corn)"></i>Em negociação</span></div>`};
  const semAc=D.clientes.filter(c=>c.ult>30&&c.status!=='inativo').sort((a,b)=>b.ult-a.ult);

function linechart(data){
  const W=560,H=190,pl=34,pr=16,pt=14,pb=26,min=20,max=32;
  const x=i=>pl+i*(W-pl-pr)/(data.length-1),y=v=>pt+(max-v)/(max-min)*(H-pt-pb);
  const pts=data.map((d,i)=>[x(i),y(d.v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0]} ${H-pb} L${pts[0][0]} ${H-pb} Z`;
  const ticks=[20,24,28,32];
  return `<div class="linechart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Clientes ativos de junho a novembro: ${data.map(d=>d.m+' '+d.v).join(', ')}">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-data)">${t}</text>`).join('')}
   <path d="${area}" fill="var(--leaf)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--leaf)" stroke-width="2.5" stroke-linejoin="round"/>
   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?'var(--leaf)':'var(--surface)'}" stroke="var(--leaf)" stroke-width="2"/><circle cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent" data-tip="${data[i].m}: ${data[i].v} clientes ativos"/><text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${data[i].m}</text>`).join('')}
   <text x="${pts[pts.length-1][0]-8}" y="${pts[pts.length-1][1]-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--fg)">${data[data.length-1].v}</text></svg></div>`;
}

function responder(q){
  const t=q.toLowerCase();
  const c=D.clientes.find(c=>t.includes(c.nome.toLowerCase())||t.includes(c.nome.toLowerCase().split(' ').slice(-1)[0])&&c.nome.split(' ').slice(-1)[0].length>4);
  const li=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  const lj=[...D.lojas].sort((a,b)=>b.nome.length-a.nome.length).find(l=>t.includes(l.nome.toLowerCase())&&(t.includes(curtoCanal(cli(l.canal)).toLowerCase())||!D.lojas.some(o=>o!==l&&o.nome===l.nome)));
  if(lj&&/compr|loja|unidade|carteira|client/.test(t)){const cs=daLoja(lj.id);return `<b>${esc(lojaNome(lj))}</b> tem ${cs.length} cliente${cs.length===1?'':'s'} vinculado${cs.length===1?'':'s'}:${li(cs.map(c=>`<a href="#cliente-${c.id}">${esc(c.nome)}</a> · ${esc(c.area)} · visita há ${c.ult} dias`))}<a href="#loja-${lj.id}">Abrir carteira da loja</a><div class="src">Fonte: vínculos de clientes com lojas</div>`}
  if(/anivers/.test(t)){const a=aniversarios(7);return `Aniversários nos próximos 7 dias:${li(a.map(x=>`<b>${esc(x.p.n)}</b> (${esc(x.c.nome)}) · ${x.quando}`))}<div class="src">Fonte: contatos cadastrados</div>`}
  if(/campo|ensaio|produtiv|sc\/ha|desempenho/.test(t)&&!c){return `Nos campos desta safra:${li(['<b>Área comercial Mantovani</b>: DKB358PRO4 156 sc/ha, TL 310 VIP 148, Concorrente B 139.','<b>Vitrine Linha São Pedro</b>: em V10, estande de 64.200 pl/ha no DKB358PRO4, o melhor dos três.','<b>Ensaio Sítio Baretta</b>: plantio previsto para 25 jan.'])}<div class="src">Fonte: 3 campos demonstrativos, 3 avaliações</div>`}
  if(/sem visita|sem acompanh|aten[cç]|esquec/.test(t)){const l=D.clientes.filter(c=>c.ult>30&&c.status!=='inativo').sort((a,b)=>b.ult-a.ult);return `${l.length} clientes estão há mais de 30 dias sem visita:${li(l.map(c=>`<a href="#cliente-${c.id}">${esc(c.nome)}</a> · ${c.ult} dias · potencial ${c.potencial.toLowerCase()}`))}Sugestão: a Campo Verde e o Ricardo Kunz ficam a 38 km um do outro. Dá para visitar os dois na sexta.<div class="src">Fonte: linha do tempo de ${D.clientes.length} clientes</div>`}
  if(/atras|pend/.test(t)){const l=D.tarefas.filter(x=>!x.done).sort((a,b)=>a.prazo.localeCompare(b.prazo));return `Você tem ${l.length} tarefas abertas, ${l.filter(x=>tarefaEstado(x)==='late').length} atrasadas:${li(l.map(x=>`${tarefaEstado(x)==='late'?'<b style="color:var(--risk)">Atrasada</b> · ':''}${esc(x.t)} · ${quando(x.prazo)}`))}<div class="src">Fonte: tarefas</div>`}
  if(/negocia|funil|safrinha|sacos|aberto|previs/.test(t)){const ab=abertas().filter(o=>!/safrinha/.test(t)||o.safra.includes('Safrinha'));return `${/safrinha/.test(t)?'Na safrinha 2027':'No total'}, há <b>${fmt(sum(ab,o=>o.sc))} sc</b> em aberto em ${ab.length} oportunidades. Pela etapa de cada uma, a previsão é de <b>${fmt(Math.round(sum(ab,o=>o.sc*PROB[o.etapa])))} sc</b>.${li(ab.sort((a,b)=>b.sc-a.sc).map(o=>`${esc(cli(o.c).nome)} · ${o.p} · ${fmt(o.sc)} sc · ${o.etapa.toLowerCase()}`))}<div class="src">Fonte: oportunidades</div>`}
  if(/vend|compr|fech/.test(t)){const fe=D.opps.filter(o=>o.etapa==='Fechada'&&(!/cooperativ/.test(t)||cli(o.c).tipo==='Cooperativa'));return `${/cooperativ/.test(t)?'Para cooperativas':'No total'}, foram fechados <b>${fmt(sum(fe,o=>o.sc))} sc</b> na safra:${li(fe.map(o=>`${esc(cli(o.c).nome)} · ${o.p} · ${fmt(o.sc)} sc`))}<div class="src">Fonte: oportunidades fechadas</div>`}
  if(c){const ops=D.opps.filter(o=>o.c===c.id),u=c.tl[0];return `<b>${esc(c.nome)}</b> · ${c.tipo.toLowerCase()} em ${esc(c.cidade)}, potencial ${c.potencial.toLowerCase()}.${li([`Última interação ${quando(u.d)}: ${esc(u.t)}. ${esc(u.p)}`,`Contato principal: ${esc(c.contatos[0].n)} (${esc(c.contatos[0].f.toLowerCase())}).`,ops.length?`Oportunidades: ${ops.map(o=>`${o.p} ${fmt(o.sc)} sc (${o.etapa.toLowerCase()})`).join('; ')}.`:'Nenhuma oportunidade registrada.',...D.tarefas.filter(x=>x.c===c.id&&!x.done).map(x=>`Pendente: ${esc(x.t)} · ${quando(x.prazo)}.`)])}<a href="#cliente-${c.id}">Abrir ficha</a><div class="src">Fonte: ficha e linha do tempo</div>`}
  return `Não encontrei isso nos seus registros. Posso responder sobre clientes, visitas, oportunidades, tarefas, aniversários e campos. Tente citar um cliente pelo nome ou perguntar "o que está atrasado?".`;
}

function oppSheet(id){
  const o=D.opps.find(x=>x.id==id),c=cli(o.c);
  sheet(c.nome,`<div class="sp"><div><b>${o.p}</b> · ${o.safra}</div>${etapaTag(o)}</div>
  <div class="facts" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:0"><div><small>Volume</small><b>${fmt(o.sc)} sc</b></div><div><small>Área</small><b>${fmt(o.ha)} ha</b></div><div><small>Previsão</small><b>${curto(fromIso(o.prev))}</b></div></div>
  ${o.etapa==='Perdida'?`<div class="alert"><div><b>Motivo da perda</b><span>${esc(o.motivo)}</span></div></div>`:`<div><div class="small muted" style="margin-bottom:6px">Mover para</div><div class="chips">${D.etapas.filter(e=>e!=='Perdida'&&e!==o.etapa).map(e=>`<button type="button" class="chip" data-mover="${o.id}|${e}">${e}</button>`).join('')}</div></div>
  <details><summary class="link" style="cursor:pointer;color:var(--risk)">Marcar como perdida</summary><div class="chips" style="margin-top:8px">${['Preço','Prazo de pagamento do concorrente','Produto indisponível','Cliente adiou a decisão','Relacionamento'].map(m=>`<button type="button" class="chip" data-perder="${o.id}|${m}">${m}</button>`).join('')}</div></details>`}
  <a class="btn sec wide" href="#cliente-${c.id}" data-close>Abrir ficha do cliente</a>`);
}
function campoSheet(id){
  const x=D.campos.find(c=>c.id===id);
  const mx=Math.max(...x.hib.map(h=>h.prod||h.est||0));
  sheet(x.nome,`<div class="chips"><span class="tag ${x.status==='Colhido'?'g':x.status==='Planejado'?'b':'y'}">${x.status}</span><span class="tag">${x.fase}</span><span class="tag">${x.area}</span></div>
  <div class="small muted">${esc(x.produtor)} · ${esc(x.cidade)} · plantio ${curto(fromIso(x.plantio))}</div>
  ${mx?`<div><div class="ch">${x.hib[0].prod?'Produtividade (sc/ha)':'Estande (plantas/ha)'}</div><div class="hbars">${x.hib.map(h=>{const v=h.prod||h.est;return `<div class="hb"><span>${esc(h.n)}</span><div class="trk"><i style="width:${v/mx*100}%;background:${/Concorrente/.test(h.n)?'var(--line-2)':'var(--leaf)'}"></i></div><span class="v">${fmt(v)}</span></div>`}).join('')}</div></div>`:`<div class="chips">${x.hib.map(h=>`<span class="tag">${esc(h.n)}</span>`).join('')}</div>`}
  ${x.av.length?`<div><div class="ch">Avaliações</div><div class="tl">${x.av.map(a=>`<div class="ev"><small>${curto(fromIso(a.d))}</small><b>${esc(a.t)}</b><p>${esc(a.p)}</p></div>`).join('')}</div></div>`:''}
  <div class="sp" style="justify-content:flex-start"><button type="button" class="btn" data-sheet="campoav">${ic('plus',2.4)}Nova avaliação</button><a class="btn sec" href="#cliente-${x.c}" data-close>Ficha do cliente</a></div>`);
}

/* ================= Interações ================= */
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600)}
function registrarOffline(){if(S.offline){S.pendSync++;syncUi()}}
function syncUi(){document.querySelectorAll('.sync').forEach(b=>b.classList.toggle('off',S.offline));document.querySelectorAll('.sync-t').forEach(s=>s.textContent=S.offline?'Sem internet · '+S.pendSync+' registro'+(S.pendSync===1?'':'s')+' aguardando':'Sincronizado · Google Agenda conectado')}

document.addEventListener('click',e=>{
  if(e.target.classList.contains('sheet-bg')){closeSheet();return}
  const b=e.target.closest('button,a,tr[data-cli],tr[data-opp]'); if(!b)return;
  if(b.hasAttribute('data-close')){closeSheet();return}
  const d=b.dataset;
  if(d.ask){perguntar(d.ask);return}
  if(d.pre!==undefined)S.pre=d.pre;
  if(d.sheet){e.preventDefault();SHEETS[d.sheet](d.pre);return}
  if(d.go){closeSheet();if(d.go==='registrar'){S.rec={fase:'pronto',tipo:'Visita',c:[d.pre,S.pre].find(x=>cli(x))||'alfa'}}go(d.go);return}
  if(d.cli){closeSheet();S.tabFicha='tl';go('cliente-'+d.cli);return}
  if(d.opp){oppSheet(d.opp);return}
  if(d.campo){campoSheet(d.campo);return}
  if(d.task){const t=D.tarefas.find(x=>x.id==d.task);t.done=!t.done;registrarOffline();toast(t.done?'Tarefa concluída':'Tarefa reaberta');route();return}
  if(d.fcli){S.filtroCli=d.fcli;document.querySelectorAll('[data-fcli]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderCliList();return}
  if(d.ftab){S.tabFicha=d.ftab;route();return}
  if(d.safra){S.funilSafra=d.safra;route();return}
  if(d.fmodo){S.funilModo=d.fmodo;route();return}
  if(d.ctab){S.campoTab=d.ctab;route();return}
  if(d.agm){S.agModo=d.agm;route();return}
  if(d.dia){S.agDia=d.dia;if(S.agModo==='mês'&&matchMedia('(max-width:900px)').matches){}route();return}
  if(d.mes){const s=fromIso(S.agDia);S.agDia=iso(new Date(s.getFullYear(),s.getMonth()+Number(d.mes),1));route();return}
  if(d.tf){S.tarefaF=d.tf;route();return}
  if(d.modelo){S.modelo=d.modelo;route();return}
  if(d.per){S.periodo=d.per;route();return}
  if(d.esc){S.escopo=d.esc;route();return}
  if(d.exp){const nm={PDF:'fechamento-novembro-2026.pdf',Excel:'fechamento-novembro-2026.xlsx'}[d.exp];toast(nm?'Arquivo pronto: '+nm:'Relatório enviado por '+d.exp);D.relHist.unshift({t:MODELOS.find(m=>m[0]===S.modelo)[1]+' · novembro 2026',d:iso(HOJE),f:d.exp});setTimeout(route,50);return}
  if(d.rtipo){S.rec.tipo=d.rtipo;route();return}
  if(d.mover){const [id,et]=d.mover.split('|');const o=D.opps.find(x=>x.id==id);o.etapa=et;registrarOffline();closeSheet();toast(`${cli(o.c).nome}: ${et.toLowerCase()}`);route();return}
  if(d.perder){const [id,m]=d.perder.split('|');const o=D.opps.find(x=>x.id==id);o.etapa='Perdida';o.motivo=m;closeSheet();toast('Oportunidade marcada como perdida');route();return}
  if(d.copy){const v=d.copy;const ok=()=>toast('Telefone copiado: '+v);try{navigator.clipboard.writeText(v).then(ok,()=>toast(v))}catch(_){toast(v)}return}
  if(d.act==='sync'){S.offline=!S.offline;if(!S.offline&&S.pendSync){toast(S.pendSync+' registro'+(S.pendSync>1?'s':'')+' sincronizado'+(S.pendSync>1?'s':''));S.pendSync=0}else toast(S.offline?'Modo sem internet: tudo continua funcionando':'Sincronizado');syncUi();return}
  if(d.pot){b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(d.evt||d.prio){b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(b.id==='mic'){if(S.rec.fase==='gravando'){clearInterval(S.recT);S.rec.fase='revisar'}else S.rec.fase='gravando';route();return}
  if(b.id==='nl-add'){$('#nl-c').value='novo';$('#nl-novo').hidden=false;b.hidden=true;$('#nl-cn').focus();return}
  if(b.id==='regravar'){S.rec.fase='pronto';route();return}
  if(b.id==='salvar'){salvarVoz();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-reg'){S.regiao=t.value;renderCliList()}
  if(t.id==='nl-c'){const n=t.value==='novo';$('#nl-novo').hidden=!n;$('#nl-add').hidden=n;if(n)$('#nl-cn').focus()}
  if(t.id==='cart-sel'){go('loja-'+t.value)}
  if(t.id==='f-loja'){S.lojaF=t.value;renderCliList()}
  if(t.id==='nc-t'){const canal=['Cooperativa','Revenda','Loja agropecuária'].includes(t.value);$('#nc-l-w').hidden=canal;$('#nc-lojas-w').hidden=!canal}
  if(t.id==='r-cli'){S.rec.c=t.value}
  if(t.id==='r-audio'&&t.files.length){S.rec.fase='revisar';route();toast('Áudio recebido: '+t.files[0].name)}
  if(t.dataset.dash){S.dash[t.dataset.dash]=t.checked;try{localStorage.setItem('talhao-dash',JSON.stringify(S.dash))}catch(_){}if(S.route==='inicio')route()}
  if(t.matches('[data-anexo]')&&t.files.length){const a=$('#anexos');const n=[...t.files].map(f=>f.name).join(', ');if(a)a.textContent=n;else toast(t.files.length+' arquivo(s) anexado(s)')}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,v=id=>($('#'+id)||{}).value||'';
  if(f.id==='askf'){const q=v('askq').trim();if(q)perguntar(q);return}
  if(f.id==='form-cli'){const id='n'+Date.now();const pot=($('#nc-p [aria-pressed="true"]')||{}).dataset.pot||'Médio';const [cn,...cf]=(v('nc-ct')||'Contato principal').split(/[,·-]/);
    D.clientes.unshift({id,nome:v('nc-n'),tipo:v('nc-t'),cidade:v('nc-c')||'—',regiao:'Oeste SC',segmento:['Cooperativa','Revenda','Loja agropecuária'].includes(v('nc-t'))?'Canal':'Produtor',potencial:pot,status:'potencial',ult:0,area:'Cadastro novo',lojas:v('nc-l')&&$('#nc-l-w').hidden===false?[v('nc-l')]:[],contatos:[{n:cn.trim(),f:(cf.join(' ').trim()||'Contato'),t:v('nc-tel')||'—',e:''}],props:[],tl:[{d:iso(HOJE),k:'Cadastro',t:'Cliente cadastrado',p:'Ficha criada.',novo:true}]});
    if(!$('#nc-lojas-w').hidden)v('nc-lojas').split('\n').map(x=>x.trim()).filter(Boolean).forEach((x,i)=>D.lojas.push({id:id+'-'+i,canal:id,nome:x}));
    registrarOffline();closeSheet();toast('Cliente cadastrado');go('cliente-'+id);return}
  if(f.id==='form-vinc'){const c=cli(v('vc-id'));c.lojas=[...f.querySelectorAll('input[name=vl]:checked')].map(x=>x.value);closeSheet();toast(c.lojas.length?'Lojas atualizadas':'Cliente sem loja vinculada');route();return}
  if(f.id==='form-vl'){const c=cli(v('vl-c')),lid=v('vl-id');c.lojas=[...new Set([...(c.lojas||[]),lid])];closeSheet();toast(c.nome+' vinculado a '+lojaNome(loja(lid)));route();return}
  if(f.id==='form-nl'){const id='x'+Date.now();let canal=v('nl-c');
    if(canal==='novo'){if(!v('nl-cn').trim()){$('#nl-cn').focus();toast('Escreva o nome da cooperativa ou revenda');return}canal='n'+Date.now();D.clientes.unshift({id:canal,nome:v('nl-cn').trim(),tipo:v('nl-ct'),cidade:v('nl-cc')||'—',regiao:'Oeste SC',segmento:'Canal',potencial:'Médio',status:'potencial',ult:0,area:'Cadastro novo',contatos:[{n:'Contato principal',f:'A completar',t:'—',e:''}],props:[],tl:[{d:iso(HOJE),k:'Cadastro',t:'Cliente cadastrado',p:'Criado junto com a loja '+v('nl-n')+'.',novo:true}]})}
    D.lojas.push({id,canal,nome:v('nl-n'),obs:v('nl-o')});closeSheet();toast('Loja criada: '+lojaNome(loja(id)));go('loja-'+id);return}
  if(f.id==='form-ct'){const c=cli(S.arg);if(c){const a=v('ct-a').split('/');c.contatos.push({n:v('ct-n'),f:v('ct-f'),t:v('ct-t')||'—',e:v('ct-e'),aniv:a.length===2?a[1].padStart(2,'0')+'-'+a[0].padStart(2,'0'):''});S.tabFicha='ct'}closeSheet();toast('Contato adicionado');route();return}
  if(f.id==='form-opp'){D.opps.push({id:Date.now(),c:v('op-c'),p:v('op-p'),safra:v('op-s'),sc:+v('op-v')||0,ha:+v('op-a')||0,etapa:v('op-e'),prev:v('op-d')});registrarOffline();closeSheet();toast('Oportunidade criada');go('oportunidades');return}
  if(f.id==='form-ev'){const tipo=($('#ev-t [aria-pressed="true"]')||{}).dataset.evt||'Visita';const c=cli(v('ev-c'));D.eventos.push({d:v('ev-d'),h:v('ev-h'),t:tipo+' · '+c.nome,c:c.id,s:v('ev-s')||c.cidade,k:tipo==='Campo'?'f':'v'});S.agDia=v('ev-d');registrarOffline();closeSheet();toast($('#ev-g')&&$('#ev-g').checked?'Agendado e enviado ao Google Agenda':'Agendado');go('agenda');return}
  if(f.id==='form-tf'){D.tarefas.push({id:Date.now(),t:v('tf-t'),c:v('tf-c'),prazo:v('tf-d'),prio:($('#tf-p [aria-pressed="true"]')||{}).dataset.prio||'Média',done:false});registrarOffline();closeSheet();toast('Tarefa criada');route();return}
  if(f.id==='form-ca'){const x=D.campos.find(c=>c.id===v('ca-c'));if(x)x.av.unshift({d:v('ca-d'),t:v('ca-t'),p:v('ca-o')||'Sem observações.'});registrarOffline();closeSheet();toast('Avaliação salva');S.campoTab='campos';go('campo');return}
  if(f.id==='form-co'){D.concorrencia.unshift({d:iso(HOJE),reg:v('co-r'),t:v('co-t'),p:v('co-p')});closeSheet();toast('Informação salva');S.campoTab='conc';go('campo');return}
  if(f.id==='form-rt'){const c=cli(v('rt-c'));c.tl.unshift({d:iso(HOJE),k:v('rt-k'),t:v('rt-t'),p:v('rt-p')||'',novo:true});c.ult=0;if(v('rt-n'))D.tarefas.push({id:Date.now(),t:v('rt-n'),c:c.id,prazo:iso(add(7)),prio:'Média',done:false});registrarOffline();closeSheet();toast('Registro salvo no histórico');S.tabFicha='tl';go('cliente-'+c.id);return}
});
function salvarVoz(){
  const v=id=>$('#'+id).value;const c=cli(v('f-c'));
  c.tl.unshift({d:iso(HOJE),k:S.rec.tipo,t:v('f-as')+' · '+v('f-pr'),p:'Oportunidade de trabalhar o '+v('f-pr')+' na '+v('f-op').toLowerCase()+'. Próxima ação: '+v('f-nx').toLowerCase()+'.',tags:['Registrado por voz',v('f-pr')],novo:true});
  c.ult=0;
  if($('#s1').checked)D.tarefas.push({id:Date.now(),t:v('f-nx')+' · '+c.nome,c:c.id,prazo:v('f-pz'),prio:'Alta',done:false});
  if($('#s2').checked){const o=D.opps.find(o=>o.c===c.id&&o.p===v('f-pr')&&!['Fechada','Perdida'].includes(o.etapa));if(o)o.etapa='Negociação';else D.opps.push({id:Date.now()+1,c:c.id,p:v('f-pr'),safra:v('f-op'),sc:300,ha:290,etapa:'Negociação',prev:iso(add(30))})}
  if($('#s3').checked)D.eventos.push({d:iso(add(8)),h:'09:00',t:'Visita · '+c.nome,c:c.id,s:'Retorno: '+v('f-nx').toLowerCase(),k:'v'});
  registrarOffline();S.rec=null;S.tabFicha='tl';toast('Salvo no histórico de '+c.nome);go('cliente-'+c.id);
}
function perguntar(q){
  S.chat.push({u:1,h:esc(q)});S.chat.push({h:responder(q)});
  if(S.route!=='assistente'){go('assistente');return}
  route();
  const ch=$('#chat');if(ch){const last=ch.lastElementChild;last&&last.scrollIntoView({block:'nearest'})}
  const i=$('#askq');if(i)i.focus();
}

/* busca global */
const q=$('#q'),res=$('#results');
q.addEventListener('input',()=>{
  const t=q.value.trim().toLowerCase();if(t.length<2){res.hidden=true;return}
  const cs=D.clientes.filter(c=>(c.nome+' '+c.cidade+' '+c.tipo).toLowerCase().includes(t));
  const ps=[];D.clientes.forEach(c=>c.contatos.forEach(p=>{if((p.n+' '+p.f).toLowerCase().includes(t))ps.push({c,p})}));
  const os=D.opps.filter(o=>o.p.toLowerCase().includes(t));
  const ls=D.lojas.filter(l=>lojaNome(l).toLowerCase().includes(t));
  res.innerHTML=(ls.length?'<h4>Lojas</h4>'+ls.slice(0,5).map(l=>`<a class="row" href="#loja-${l.id}" style="padding:8px 12px;text-decoration:none;color:inherit"><span class="av s">${ic('store')}</span><div class="m"><b>${esc(lojaNome(l))}</b><small>${daLoja(l.id).length} clientes vinculados</small></div></a>`).join(''):'')+(cs.length?'<h4>Clientes</h4>'+cs.slice(0,5).map(c=>`<button type="button" class="row" data-cli="${c.id}" style="padding:8px 12px"><span class="av ${avc(c)}">${ini(c.nome)}</span><div class="m"><b>${esc(c.nome)}</b><small>${c.tipo} · ${esc(c.cidade)}</small></div></button>`).join(''):'')+
   (ps.length?'<h4>Contatos</h4>'+ps.slice(0,5).map(x=>`<button type="button" class="row" data-cli="${x.c.id}" style="padding:8px 12px"><span class="av">${ini(x.p.n)}</span><div class="m"><b>${esc(x.p.n)}</b><small>${esc(x.p.f)} · ${esc(x.c.nome)}</small></div></button>`).join(''):'')+
   (os.length?'<h4>Oportunidades</h4>'+os.slice(0,5).map(o=>`<button type="button" class="row" data-opp="${o.id}" style="padding:8px 12px"><span class="av c">${ic('funnel')}</span><div class="m"><b>${esc(cli(o.c).nome)} · ${o.p}</b><small>${o.safra} · ${fmt(o.sc)} sc · ${o.etapa.toLowerCase()}</small></div></button>`).join(''):'')||
   `<div class="empty">Nada encontrado para "${esc(q.value)}". <button type="button" class="link" data-ask="${esc(q.value)}">Perguntar ao assistente</button></div>`;
  res.hidden=false;
});
document.addEventListener('click',e=>{if(!e.target.closest('.gsearch')){res.hidden=true}else if(e.target.closest('.results button,.results a')){res.hidden=true;q.value=''}},true);
q.addEventListener('keydown',e=>{if(e.key==='Escape'){res.hidden=true;q.blur()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').innerHTML)closeSheet();if(e.key==='/'&&!e.target.closest('input,textarea,select')){e.preventDefault();q.focus()}});

/* dicas nos gráficos */
const tip=$('#tip');
const showTip=(el,x,y)=>{tip.textContent=el.dataset.tip;tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-r.width-8,x-r.width/2))+'px';tip.style.top=Math.max(8,y-r.height-12)+'px'};
document.addEventListener('pointermove',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-tip]');if(el&&e.pointerType!=='mouse'){showTip(el,e.clientX,e.clientY);setTimeout(()=>tip.hidden=true,1800)}});

addEventListener('scroll',()=>{tip.hidden=true},{passive:true});
addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>4),{passive:true});
addEventListener('hashchange',()=>{tip.hidden=true;closeSheet();route();window.scrollTo(0,0)});
route();
})();
</script>
